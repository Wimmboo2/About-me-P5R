<!doctype html>
<!-- Last Updated: 2026-04-30 -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persona 5 Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --p5-red: #d10000;
      --p5-black: #0a0a0a;
      --p5-white: #f0f0f0;
      --p5-ease: cubic-bezier(0.77, 0, 0.18, 1);
    }

    * {
      box-sizing: border-box;
      cursor: none !important;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--p5-black);
      color: var(--p5-white);
      font-family: "Rajdhani", sans-serif;
    }

    #cursor {
      position: fixed;
      width: 14px;
      height: 14px;
      background: var(--p5-white);
      transform: translate(-50%, -50%) rotate(45deg);
      pointer-events: none;
      z-index: 200;
      transition:
        transform 180ms var(--p5-ease),
        background-color 180ms var(--p5-ease),
        box-shadow 180ms var(--p5-ease);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
    }

    #cursor.hover {
      background: var(--p5-red);
      transform: translate(-50%, -50%) rotate(45deg) scale(1.7);
      box-shadow: 0 0 16px rgba(209, 0, 0, 0.85);
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transform: scale(1.02);
      transition:
        opacity 360ms var(--p5-ease),
        transform 500ms var(--p5-ease);
      will-change: opacity, transform;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    #transitionMask {
      position: fixed;
      inset: 0;
      z-index: 149;
      pointer-events: none;
      background: var(--p5-black);
      opacity: 0;
    }

    .hub {
      overflow: hidden;
      background: transparent;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      filter: saturate(0.9) brightness(0.35) contrast(1.1);
      will-change: transform;
    }

    .hub-menu {
      position: absolute;
      top: 35%;
      left: 5%;
      display: grid;
      gap: 16px;
      z-index: 22;
      width: 39vw;
      min-width: 360px;
    }

    .menu-item {
      position: relative;
      border: none;
      background: var(--p5-white);
      color: #000;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(32px, 3.3vw, 52px);
      letter-spacing: 2px;
      text-align: left;
      padding: 18px 34px 16px 56px;
      margin-left: 0;
      clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
      transform: translateX(-120%);
      transform-origin: left center;
      opacity: 0;
      transition:
        transform 240ms var(--p5-ease),
        color 200ms var(--p5-ease),
        background-color 200ms var(--p5-ease),
        box-shadow 220ms var(--p5-ease);
    }

    .menu-item:nth-child(1) {
      width: min(520px, 34vw);
    }

    .menu-item:nth-child(2) {
      width: min(500px, 33vw);
    }

    .menu-item:nth-child(3) {
      width: min(482px, 32vw);
    }

    .menu-item span,
    .menu-item i {
      display: inline-block;
      font-style: normal;
    }

    .menu-item i {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translate(-12px, -50%);
      opacity: 0;
      transition:
        transform 200ms var(--p5-ease),
        opacity 180ms var(--p5-ease);
    }

    .menu-item.in {
      transform: translateX(0);
      opacity: 1;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
      background: var(--p5-red);
      color: var(--p5-white);
      transform: translateX(0) scale(1.02);
      box-shadow: 0 0 24px rgba(209, 0, 0, 0.7);
    }

    .menu-item:focus-visible,
    .back-btn:focus-visible,
    .link-box:focus-visible,
    .slot:focus-visible {
      outline: 3px solid var(--p5-white);
      outline-offset: 4px;
    }

    .subscreen {
      background: transparent;
    }

    .card {
      position: absolute;
      right: 8%;
      top: 14%;
      width: min(760px, 58vw);
      min-height: 64vh;
      padding: 34px;
      background: var(--p5-red);
      transform: skewX(-9deg) translateX(150%) rotate(8deg);
      opacity: 0;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .card.in {
      animation: cardSlam 620ms var(--p5-ease) forwards;
    }

    .card>* {
      transform: skewX(9deg);
    }

    .card h2 {
      margin: 18px 0 14px;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(64px, 9vw, 140px);
      line-height: 0.9;
      letter-spacing: 3px;
      position: relative;
      z-index: 2;
    }

    .rank {
      position: absolute;
      right: 6%;
      top: 12%;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(220px, 32vw, 420px);
      color: rgba(255, 255, 255, 0.16);
      z-index: 1;
      pointer-events: none;
    }

    .link-box {
      position: relative;
      display: inline-block;
      text-decoration: none;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.9);
      padding: 12px 18px;
      font-family: "Rajdhani", sans-serif;
      font-size: clamp(20px, 2.2vw, 32px);
      letter-spacing: 0.5px;
      background: rgba(0, 0, 0, 0.26);
      transition:
        transform 180ms var(--p5-ease),
        background-color 180ms var(--p5-ease),
        box-shadow 200ms var(--p5-ease);
      z-index: 2;
    }

    .link-box:hover {
      transform: translateY(-2px);
      background: rgba(0, 0, 0, 0.45);
      box-shadow: 0 0 26px rgba(209, 0, 0, 0.8);
      animation: shaky 300ms var(--p5-ease);
    }

    .info-text {
      margin-top: 14px;
      font-size: clamp(20px, 1.8vw, 30px);
      line-height: 1.35;
      max-width: 92%;
      position: relative;
      z-index: 2;
    }

    .back-btn {
      position: absolute;
      left: 4%;
      bottom: 8%;
      z-index: 5;
      width: max-content;
      border: none;
      background: var(--p5-white);
      color: #000;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(18px, 2vw, 28px);
      letter-spacing: 2px;
      padding: 10px 20px 8px 34px;
      transform: skewX(-12deg) translateX(-120%);
      opacity: 0;
      transition:
        transform 240ms var(--p5-ease),
        color 200ms var(--p5-ease),
        background-color 200ms var(--p5-ease),
        box-shadow 220ms var(--p5-ease);
    }

    .back-btn span,
    .back-btn i {
      display: inline-block;
      transform: skewX(12deg);
      font-style: normal;
    }

    .back-btn i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translate(-10px, -50%) skewX(12deg);
      opacity: 0;
      transition:
        transform 200ms var(--p5-ease),
        opacity 180ms var(--p5-ease);
    }

    .back-btn.in {
      transform: skewX(-12deg) translateX(0);
      opacity: 1;
    }

    .proj-stripe {
      position: absolute;
      top: 6%;
      left: -10%;
      width: 120%;
      height: 14%;
      background: linear-gradient(95deg,
          rgba(209, 0, 0, 0.97),
          rgba(209, 0, 0, 0.7));
      transform: rotate(-6deg);
      z-index: 2;
    }

    .proj-title {
      position: absolute;
      top: 7%;
      left: 5%;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(84px, 12vw, 180px);
      line-height: 0.75;
      letter-spacing: 2px;
      z-index: 2;
      opacity: 0;
      transform: translateY(-90px) rotate(-4deg);
      text-shadow: 4px 4px 0 #000;
    }

    .proj-title b {
      color: var(--p5-red);
      font-weight: 400;
    }

    .proj-title span {
      color: var(--p5-white);
      font-weight: 400;
    }

    .proj-title.in {
      animation: projTitleIn 620ms var(--p5-ease) forwards;
    }

    .slots {
      position: absolute;
      left: 8%;
      top: 30%;
      width: min(980px, 84vw);
      display: grid;
      gap: 14px;
      z-index: 3;
      perspective: 900px;
    }

    .slot {
      --stack-y: 0px;
      --stack-scale: 1;
      --stack-rot: 0deg;
      background: rgba(255, 255, 255, 0.96);
      border-left: 8px solid #000;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 90px 1fr auto;
      align-items: center;
      color: #000;
      font-size: clamp(18px, 1.7vw, 28px);
      letter-spacing: 0.5px;
      transform: translateX(130%) translateY(var(--stack-y)) scale(var(--stack-scale)) rotate(var(--stack-rot));
      transform-origin: left center;
      opacity: 0;
      transition:
        transform 260ms var(--p5-ease),
        box-shadow 220ms var(--p5-ease),
        background-color 220ms var(--p5-ease),
        color 180ms var(--p5-ease),
        border-color 180ms var(--p5-ease),
        opacity 200ms var(--p5-ease);
    }

    .slot.in {
      opacity: 1;
      transform: translateX(0) translateY(var(--stack-y)) scale(var(--stack-scale)) rotate(var(--stack-rot));
    }

    .slot .num {
      font-family: "Bebas Neue", sans-serif;
      font-size: 38px;
      letter-spacing: 2px;
    }

    .slot .name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 34px;
      letter-spacing: 2px;
    }

    .slot .time {
      opacity: 0.45;
      font-size: 18px;
    }

    .slot.active {
      background: var(--p5-red);
      color: #fff;
      border-left-color: #fff;
      transform: translateX(0) translateY(var(--stack-y)) translateX(26px) scale(1.05) rotate(-0.5deg);
      box-shadow:
        0 14px 34px rgba(209, 0, 0, 0.5),
        0 2px 10px rgba(0, 0, 0, 0.45);
    }

    .slot:hover:not(.active) {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }

    .inline-link {
      display: inline-block;
      padding: 4px 10px;
      font-size: 18px;
      margin-left: 8px;
    }

    @media (max-width: 1024px) {
      html,
      body {
        height: 100%;
        min-height: 100dvh;
      }

      .screen {
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .hub-menu {
        top: 27%;
        left: 50%;
        width: min(92vw, 680px);
        min-width: 0;
        transform: translateX(-50%);
      }

      .menu-item:nth-child(1),
      .menu-item:nth-child(2),
      .menu-item:nth-child(3) {
        width: 100%;
      }

      .card {
        right: 50%;
        top: 12%;
        width: min(92vw, 720px);
        min-height: auto;
        transform: skewX(-7deg) translateX(150%) rotate(5deg);
      }

      .card.in {
        animation: cardSlamTablet 580ms var(--p5-ease) forwards;
      }

      .card h2 {
        font-size: clamp(58px, 8.5vw, 112px);
      }

      .rank {
        font-size: clamp(140px, 24vw, 280px);
      }

      .proj-title {
        top: 8%;
        left: 50%;
        transform: translate(-50%, -60px) rotate(-3deg);
        text-align: center;
      }

      .proj-title.in {
        animation: projTitleInTablet 560ms var(--p5-ease) forwards;
      }

      .slots {
        left: 50%;
        top: 30%;
        width: min(92vw, 860px);
        transform: translateX(-50%);
      }
    }

    @media (max-width: 768px) {
      html,
      body {
        overflow: auto;
      }

      .screen {
        position: absolute;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 24px 16px 112px;
      }

      .hub {
        display: grid;
        align-content: center;
      }

      .hub-menu {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: min(92vw, 560px);
        margin: 0 auto;
        gap: 12px;
      }

      .menu-item {
        font-size: clamp(30px, 8vw, 44px);
        padding: 16px 22px 14px 46px;
        min-height: 62px;
      }

      .menu-item i {
        left: 18px;
      }

      .subscreen {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .card {
        position: relative;
        right: auto;
        top: auto;
        width: min(92vw, 680px);
        margin-top: clamp(70px, 12vh, 120px);
        padding: 22px 18px;
        transform: skewX(-4deg) translateX(140%) rotate(3deg);
      }

      .card.in {
        animation: cardSlamMobile 500ms var(--p5-ease) forwards;
      }

      .card>* {
        transform: skewX(4deg);
      }

      .card h2 {
        font-size: clamp(44px, 13vw, 82px);
        letter-spacing: 2px;
      }

      .rank {
        right: 4%;
        top: 6%;
        font-size: clamp(110px, 31vw, 190px);
      }

      .link-box {
        min-height: 48px;
        font-size: clamp(18px, 4.6vw, 24px);
        padding: 10px 14px;
      }

      .info-text {
        max-width: 100%;
        font-size: clamp(18px, 4.8vw, 24px);
        line-height: 1.4;
      }

      .back-btn {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: skewX(-12deg) translateX(-150%);
        padding: 12px 20px 10px 34px;
        min-height: 52px;
      }

      .back-btn.in {
        transform: skewX(-12deg) translateX(-50%);
      }

      .proj-stripe {
        top: 42px;
        left: -20%;
        width: 140%;
        height: 84px;
        transform: rotate(-4deg);
      }

      .proj-title {
        position: relative;
        top: auto;
        left: auto;
        transform: translateY(-60px) rotate(-2deg);
        font-size: clamp(66px, 18vw, 104px);
        margin-top: 24px;
        margin-bottom: 12px;
      }

      .proj-title.in {
        animation: projTitleInMobile 520ms var(--p5-ease) forwards;
      }

      .slots {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: min(92vw, 720px);
        gap: 10px;
        margin-top: 10px;
      }

      .slot {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "num name"
          "num time";
        align-items: start;
        padding: 12px 12px 12px 14px;
        min-height: 74px;
      }

      .slot .num {
        grid-area: num;
        min-width: 62px;
        font-size: 30px;
      }

      .slot .name {
        grid-area: name;
        font-size: clamp(24px, 5.8vw, 30px);
        line-height: 1;
      }

      .slot .time {
        grid-area: time;
        font-size: 15px;
        margin-top: 2px;
      }

      .slot.active {
        transform: translateX(0) translateY(var(--stack-y)) translateX(8px) scale(1.02) rotate(-0.2deg);
      }

      .inline-link {
        margin-left: 0;
        margin-top: 6px;
      }
    }

    @media (max-width: 480px) {
      .screen {
        padding: 18px 12px 108px;
      }

      .hub-menu {
        width: 92vw;
        gap: 10px;
      }

      .menu-item {
        font-size: clamp(26px, 8.4vw, 36px);
        letter-spacing: 1.5px;
        padding: 14px 16px 12px 40px;
      }

      .card {
        width: 92vw;
        margin-top: clamp(56px, 11vh, 90px);
        padding: 18px 14px;
      }

      .card h2 {
        margin-top: 10px;
      }

      .rank {
        opacity: 0.13;
      }

      .proj-stripe {
        top: 26px;
        height: 66px;
      }

      .proj-title {
        margin-top: 12px;
        margin-bottom: 10px;
      }

      .slots {
        width: 92vw;
        gap: 8px;
      }

      .slot {
        border-left-width: 6px;
        padding: 10px 10px 10px 12px;
      }

      .slot .num {
        min-width: 54px;
      }

      .back-btn {
        font-size: clamp(18px, 6vw, 24px);
        letter-spacing: 1.5px;
      }
    }

    @media (pointer: coarse),
    (hover: none) {
      * {
        cursor: auto !important;
      }

      #cursor {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
      }

      #cursor {
        display: none;
      }

      * {
        cursor: auto !important;
      }
    }

    @keyframes cardSlam {
      0% {
        transform: skewX(-9deg) translateX(150%) rotate(10deg);
        opacity: 0;
      }

      68% {
        transform: skewX(-9deg) translateX(-2%) rotate(-1deg);
        opacity: 1;
      }

      100% {
        transform: skewX(-9deg) translateX(0) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes projTitleIn {
      0% {
        transform: translateY(-90px) rotate(-4deg);
        opacity: 0;
      }

      70% {
        transform: translateY(8px) rotate(-4deg);
        opacity: 1;
      }

      100% {
        transform: translateY(0) rotate(-4deg);
        opacity: 1;
      }
    }

    @keyframes shaky {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-2px);
      }

      75% {
        transform: translateX(2px);
      }
    }

    @keyframes cardSlamTablet {
      0% {
        transform: translateX(150%) skewX(-7deg) rotate(6deg);
        opacity: 0;
      }

      70% {
        transform: translateX(-1%) skewX(-7deg) rotate(-0.5deg);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) skewX(-7deg) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes cardSlamMobile {
      0% {
        transform: translateX(130%) skewX(-4deg) rotate(3deg);
        opacity: 0;
      }

      70% {
        transform: translateX(2%) skewX(-4deg) rotate(-0.3deg);
        opacity: 1;
      }

      100% {
        transform: translateX(0) skewX(-4deg) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes projTitleInTablet {
      0% {
        transform: translate(-50%, -60px) rotate(-3deg);
        opacity: 0;
      }

      70% {
        transform: translate(-50%, 6px) rotate(-3deg);
        opacity: 1;
      }

      100% {
        transform: translate(-50%, 0) rotate(-3deg);
        opacity: 1;
      }
    }

    @keyframes projTitleInMobile {
      0% {
        transform: translateY(-60px) rotate(-2deg);
        opacity: 0;
      }

      70% {
        transform: translateY(6px) rotate(-2deg);
        opacity: 1;
      }

      100% {
        transform: translateY(0) rotate(-2deg);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

    <source src="bg.mp4" type="video/mp4" />
  </video>

  <div id="screen-hub" class="screen hub">

        rel="noopener noreferrer">github.com/Wimmboo2</a>

    <button class="back-btn hoverable" data-back="hub">
      <i>&gt;</i><span>&larr; BACK</span>

  </div>

    <div class="proj-stripe"></div>
    <div class="proj-title" id="projectsTitle">
      <b>PRO</b><span>JECTS</span>
    </div>
    <div class="slots">
      <!-- Dynamic content will be injected here -->
    </div>
    <button class="back-btn hoverable" data-back="hub">
      <i>&gt;</i><span>&larr; BACK</span>
    </button>
  </div>

  <div id="screen-info" class="screen subscreen">
    <div class="card" id="infoCard">
      <div class="rank">0</div>

        I mostly play Minecraft, Valorant and some Persona 5 Royal rn. <br>

      </div>
    </div>
    <button class="back-btn hoverable" data-back="hub">
      <i>&gt;</i><span>&larr; BACK</span>
    </button>
  </div>

  <div id="transitionMask"></div>
  <div id="cursor"></div>

  <script>
    const EASE = getComputedStyle(document.documentElement).getPropertyValue("--p5-ease").trim();
    const screens = {
      hub: document.getElementById("screen-hub"),
      github: document.getElementById("screen-github"),
      projects: document.getElementById("screen-projects"),
      info: document.getElementById("screen-info"),
    };

    const transitionMask = document.getElementById("transitionMask");
    const cursor = document.getElementById("cursor");
    const menuItems = [...document.querySelectorAll(".menu-item")];
    const backButtons = [...document.querySelectorAll("[data-back]")];
    const slotsContainer = document.querySelector(".slots");

    const githubCard = document.getElementById("githubCard");
    const infoCard = document.getElementById("infoCard");
    const projectsTitle = document.getElementById("projectsTitle");
    const enterMap = {
      hub: enterHub,
      github: enterGithub,
      projects: enterProjects,
      info: enterInfo,
    };
    let projectSlots = [];
    let activeProjectIndex = 0;
    let wheelLockUntil = 0;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function formatDate(isoString) {
      const date = new Date(isoString);
      const d = String(date.getDate()).padStart(2, "0");
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const y = date.getFullYear();
      const hh = String(date.getHours()).padStart(2, "0");
      const mm = String(date.getMinutes()).padStart(2, "0");
      return `${d}/${m}/${y} ${hh}:${mm}`;
    }

    async function loadProjects() {
      try {
        const response = await fetch(
          "https://api.github.com/users/Wimmboo2/repos?sort=updated&direction=desc",
        );
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const repos = await response.json();
        slotsContainer.replaceChildren();
        projectSlots = [];

        repos.slice(0, 4).forEach((repo, index) => {
          const num = String(index + 1).padStart(2, "0");
          const dateStr = formatDate(repo.updated_at);
          const slot = document.createElement("div");
          slot.className = "slot hoverable";
          slot.tabIndex = 0;

          const numEl = document.createElement("div");
          numEl.className = "num";
          numEl.textContent = num;

          const nameEl = document.createElement("div");
          nameEl.className = "name";
          nameEl.textContent = repo.name.toUpperCase();

          const timeEl = document.createElement("div");
          timeEl.className = "time";
          timeEl.textContent = dateStr;

          slot.append(numEl, nameEl, timeEl);
          slot.addEventListener("click", () => {
            window.open(repo.html_url, "_blank", "noopener,noreferrer");
          });
          slot.addEventListener("mouseenter", () => setProjectFocus(index));
          slot.addEventListener("focus", () => setProjectFocus(index));
          slotsContainer.appendChild(slot);
          projectSlots.push(slot);
        });
      } catch (e) {
        console.error("Failed to load projects", e);
        slotsContainer.replaceChildren();
        const errEl = document.createElement("div");
        errEl.style.cssText = "color:#fff;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;opacity:0.7;padding:18px 0;";
        errEl.textContent = "COULD NOT LOAD REPOS — CHECK CONNECTION";
        slotsContainer.appendChild(errEl);
      }
    }

    function setActiveScreen(name) {
      Object.values(screens).forEach((screen) =>
        screen.classList.remove("active"),
      );
      screens[name].classList.add("active");
    }

    function restartAnimation(element, className = "in") {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    async function maskWipe(duration = 350) {
      transitionMask.style.opacity = "1";
      transitionMask.style.transition = "none";
      transitionMask.style.clipPath = "polygon(0 100%,20% 100%,0 120%,0 120%)";
      await sleep(16);
      transitionMask.style.transition = `clip-path ${duration}ms ${EASE}`;
      transitionMask.style.clipPath = "polygon(-10% 100%,120% -10%,120% 120%,-10% 120%)";
      await sleep(duration + 20);
      transitionMask.style.opacity = "0";
    }

    let cursorRaf = false;
    let cursorX = 0;
    let cursorY = 0;
    addEventListener("mousemove", (event) => {
      cursorX = event.clientX;
      cursorY = event.clientY;
      if (cursorRaf) return;
      cursorRaf = true;
      requestAnimationFrame(() => {
        cursor.style.left = `${cursorX}px`;
        cursor.style.top = `${cursorY}px`;
        cursorRaf = false;
      });
    });

    document.addEventListener("pointerover", (event) => {
      if (event.target.closest(".hoverable,button,a")) {
        cursor.classList.add("hover");
      }
    });

    document.addEventListener("pointerout", (event) => {
      const related = event.relatedTarget?.closest(".hoverable,button,a");
      if (!related) {
        cursor.classList.remove("hover");
      }
    });

    async function enterHub() {
      setActiveScreen("hub");
      menuItems.forEach((item) => item.classList.remove("in"));
      for (let index = 0; index < menuItems.length; index += 1) {
        await sleep(150);
        menuItems[index].classList.add("in");
      }
    }

    function enterGithub() {
      setActiveScreen("github");
      restartAnimation(githubCard);
      const back = screens.github.querySelector(".back-btn");
      restartAnimation(back);
    }

    function enterInfo() {
      setActiveScreen("info");
      restartAnimation(infoCard);
      const back = screens.info.querySelector(".back-btn");
      restartAnimation(back);
    }

    async function enterProjects() {
      setActiveScreen("projects");
      restartAnimation(projectsTitle);
      projectSlots.forEach((slot) => slot.classList.remove("in"));
      for (let index = 0; index < projectSlots.length; index += 1) {
        await sleep(100);
        projectSlots[index].classList.add("in");
      }
      setProjectFocus(activeProjectIndex);
      const back = screens.projects.querySelector(".back-btn");
      restartAnimation(back);
    }

    function setProjectFocus(index) {
      if (!projectSlots.length) return;
      const count = projectSlots.length;
      const mobileLayout = window.matchMedia("(max-width: 768px)").matches;
      activeProjectIndex = ((index % count) + count) % count;
      projectSlots.forEach((slot, slotIndex) => {
        const distance = slotIndex - activeProjectIndex;
        const absDistance = Math.abs(distance);
        const rotate =
          mobileLayout
            ? (distance === 0 ? -0.2 : Math.max(-1.4, Math.min(1.4, distance * 0.35)))
            : (distance === 0 ? -0.5 : Math.max(-4, Math.min(4, distance * 0.8)));
        const scale =
          mobileLayout
            ? (distance === 0 ? 1.02 : Math.max(0.96, 1 - absDistance * 0.02))
            : (distance === 0 ? 1.05 : Math.max(0.9, 1 - absDistance * 0.04));
        const stackY = mobileLayout ? distance * 8 : distance * 18;
        slot.style.setProperty("--stack-y", `${stackY}px`);
        slot.style.setProperty("--stack-scale", `${scale}`);
        slot.style.setProperty("--stack-rot", `${rotate}deg`);
        slot.style.zIndex = `${120 - absDistance}`;
        slot.classList.toggle("active", slotIndex === activeProjectIndex);
      });
    }

    function shiftProjectFocus(direction) {
      if (!projectSlots.length) return;
      setProjectFocus(activeProjectIndex + direction);
    }

    async function transitionTo(target) {
      await maskWipe(350);
      const enterFn = enterMap[target];
      if (enterFn) await enterFn();
    }

    menuItems.forEach((item) => {
      item.addEventListener("click", async () => {
        await transitionTo(item.dataset.go);
      });
    });

    backButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        await transitionTo("hub");
      });
    });

    screens.projects.addEventListener(
      "wheel",
      (event) => {
        if (!screens.projects.classList.contains("active")) return;
        event.preventDefault();
        const now = Date.now();
        if (now < wheelLockUntil) return;
        wheelLockUntil = now + 120;
        shiftProjectFocus(event.deltaY > 0 ? 1 : -1);
      },
      { passive: false },
    );

    // projectSlots click and mouseenter listeners are now handled in loadProjects

    loadProjects();
    enterHub();
  </script>
</body>

</html>
